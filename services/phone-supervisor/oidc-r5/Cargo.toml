[package]
name = "phone-supervisor-oidc-r5"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "phone_supervisor_oidc_r5"
crate-type = ["cdylib"]

[dependencies]
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
