name: TokenSaver AI CI

on:
  push:
    branches: [v2-saas-alpha]
  pull_request:
    branches: [v2-saas-alpha]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm install
      - run: npm run build
      - name: Package source ZIP
        run: zip -r tokensaver-ai-v2-saas-alpha.zip . -x ".git/*" "node_modules/*" "src-tauri/target/*" "dist/*" "*/node_modules/*" "*/target/*"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tokensaver-ai-v2-saas-alpha-source
          path: tokensaver-ai-v2-saas-alpha.zip
          if-no-files-found: error
          retention-days: 14

  foundation-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm install
      - run: npm run build
