name: TokenSaver AI CI

# Keep only the newest validation for this branch; older push runs validate superseded trees.
concurrency:
  group: tokensaver-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [v2-saas-alpha]
  pull_request:
    branches: [v2-saas-alpha]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm install
      - run: npm run build
      - name: Package source ZIP
        run: zip -r tokensaver-ai-v2-saas-alpha.zip . -x ".git/*" "node_modules/*" "src-tauri/target/*" "dist/*" "*/node_modules/*" "*/target/*"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tokensaver-ai-v2-saas-alpha-source
          path: tokensaver-ai-v2-saas-alpha.zip
          if-no-files-found: error
          retention-days: 14

  foundation-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm install
      - run: npm run build


  ai-team-room-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team_room
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: team_room_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team_room -d team_room_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://team_room:ci-only-password@localhost:5432/team_room_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check independent service
        run: cargo check --manifest-path services/ai-team-room/Cargo.toml
      - name: Run service unit and PostgreSQL integration tests
        run: cargo test --manifest-path services/ai-team-room/Cargo.toml

  keycloak-oidc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start ephemeral Keycloak container
        run: |
          docker run --detach --name keycloak-ci -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-bootstrap-password \
            quay.io/keycloak/keycloak:26.3.5 start-dev --http-enabled=true --hostname-strict=false
      - name: Wait for Keycloak readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            sleep 5
          done
          curl --fail --show-error http://127.0.0.1:8080/health/ready
      - name: Create ephemeral realm and confidential client
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_TOKEN="$(curl --fail --silent --show-error \
            -d 'client_id=admin-cli' -d 'username=ci-admin' \
            -d 'password=ci-only-bootstrap-password' -d 'grant_type=password' \
            http://127.0.0.1:8080/realms/master/protocol/openid-connect/token | jq -r .access_token)"
          test -n "$ADMIN_TOKEN" && test "$ADMIN_TOKEN" != "null"
          curl --fail --silent --show-error -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/admin/realms \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"realm":"team-room-ci","enabled":true}' | grep -q '^201$'
          CLIENT_SECRET="$(openssl rand -hex 32)"
          curl --fail --silent --show-error -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/admin/realms/team-room-ci/clients \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg secret "$CLIENT_SECRET" \
              '{clientId:"team-room-ci",name:"Ephemeral CI OIDC client",enabled:true,protocol:"openid-connect",publicClient:false,clientAuthenticatorType:"client-secret",secret:$secret,serviceAccountsEnabled:true,standardFlowEnabled:false,directAccessGrantsEnabled:false}')" | grep -q '^201$'
          echo "client_secret=$CLIENT_SECRET" >> "$GITHUB_OUTPUT"
      - name: Verify real OIDC discovery, client-credentials token and JWKS signature
        env:
          CLIENT_SECRET: ${{ steps.provision.outputs.client_secret }}
        run: |
          set -euo pipefail
          ISSUER="http://127.0.0.1:8080/realms/team-room-ci"
          DISCOVERY="$(curl --fail --silent --show-error "$ISSUER/.well-known/openid-configuration")"
          test "$(echo "$DISCOVERY" | jq -r .issuer)" = "$ISSUER"
          TOKEN_ENDPOINT="$(echo "$DISCOVERY" | jq -r .token_endpoint)"
          JWKS_URI="$(echo "$DISCOVERY" | jq -r .jwks_uri)"
          TOKEN_RESPONSE="$(curl --fail --silent --show-error \
            -u "team-room-ci:$CLIENT_SECRET" -d 'grant_type=client_credentials' "$TOKEN_ENDPOINT")"
          ACCESS_TOKEN="$(echo "$TOKEN_RESPONSE" | jq -r .access_token)"
          test -n "$ACCESS_TOKEN" && test "$ACCESS_TOKEN" != "null"
          export ISSUER ACCESS_TOKEN JWKS_URI
          node <<'NODE'
          const crypto = require('node:crypto');
          const decode = value => JSON.parse(Buffer.from(value, 'base64url').toString('utf8'));
          (async () => {
            const [headerPart, payloadPart, signaturePart] = process.env.ACCESS_TOKEN.split('.');
            if (!headerPart || !payloadPart || !signaturePart) throw new Error('Malformed JWT');
            const header = decode(headerPart);
            const claims = decode(payloadPart);
            if (header.alg !== 'RS256' || !header.kid) throw new Error('Unexpected JWT header');
            if (claims.iss !== process.env.ISSUER || !claims.sub || !claims.jti || !claims.exp) {
              throw new Error('Required issuer/sub/jti/exp claims missing or invalid');
            }
            if (claims.exp <= Math.floor(Date.now() / 1000)) throw new Error('Expired token');
            const response = await fetch(process.env.JWKS_URI);
            if (!response.ok) throw new Error('JWKS fetch failed: ' + response.status);
            const jwks = await response.json();
            const matches = jwks.keys.filter(key => key.kid === header.kid && key.kty === 'RSA' && key.alg === 'RS256');
            if (matches.length !== 1) throw new Error('Expected exactly one matching RSA signing key');
            const key = crypto.createPublicKey({ key: matches[0], format: 'jwk' });
            const valid = crypto.verify('RSA-SHA256', Buffer.from(headerPart + '.' + payloadPart),
              key, Buffer.from(signaturePart, 'base64url'));
            if (!valid) throw new Error('JWT signature verification failed');
            console.log('PASS: live Keycloak discovery, client_credentials token, JWKS lookup and RS256 signature');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
