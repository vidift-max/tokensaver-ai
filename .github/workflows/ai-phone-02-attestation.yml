# Deliberately manual-only: no push, pull_request, schedule, or reusable-workflow trigger.
# Dispatch is intended only after this file has been reviewed and merged to the default branch.
name: AI-PHONE-02 Read-only Attestation Channel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-phone-02-attestation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  TARGET_SHA: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
  ATTESTATION_FORMAT_VERSION: "1"

jobs:
  ai-phone-02-attestation:
    name: Read-only PostgreSQL identity attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.16@sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87
        env:
          POSTGRES_USER: attestation
          POSTGRES_DB: attestation
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U attestation -d attestation"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout immutable AI-PHONE-02 TARGET
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
          fetch-depth: 1
          persist-credentials: false

      - name: Collect read-only provenance and PostgreSQL attestation
        id: collect
        shell: bash
        env:
          JOB_ID: ${{ github.job }}
          SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p attestation-evidence

          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "$GITHUB_REF" = "refs/heads/v2-saas-alpha"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$TARGET_SHA"
          test -n "$SERVICE_CONTAINER_ID"

          SERVICE_ACTUAL_ID="$(docker inspect --format '{{.Id}}' "$SERVICE_CONTAINER_ID")"
          SERVICE_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$SERVICE_CONTAINER_ID")"
          SERVICE_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$SERVICE_CONTAINER_ID")"
          SERVICE_REPO_DIGESTS="$(docker inspect --format '{{json .RepoDigests}}' "$SERVICE_CONTAINER_ID")"
          test "$SERVICE_ACTUAL_ID" = "$SERVICE_CONTAINER_ID"
          test "$SERVICE_IMAGE" = "postgres:16.16@sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87"
          printf '%s' "$SERVICE_REPO_DIGESTS" | grep -Fq 'sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87'

          NONCE="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          test "$(printf '%s' "$NONCE" | wc -c)" -eq 43
          APP_NAME="ai-phone-02-$NONCE"
          export NONCE APP_NAME SERVICE_ACTUAL_ID SERVICE_IMAGE SERVICE_IMAGE_ID SERVICE_REPO_DIGESTS CHECKOUT_SHA STARTED_AT

          docker exec -e PGAPPNAME="$APP_NAME" "$SERVICE_CONTAINER_ID" \
            psql -U attestation -d attestation -X -qAt -v ON_ERROR_STOP=1 \
            -c "BEGIN READ ONLY" \
            -c "SELECT json_build_object(
              'system_identifier', (SELECT system_identifier::text FROM pg_control_system()),
              'database_name', current_database(),
              'database_oid', (SELECT oid::text FROM pg_database WHERE datname = current_database()),
              'role', current_user,
              'session_user', session_user,
              'backend_pid', pg_backend_pid(),
              'backend_start', (SELECT backend_start::text FROM pg_stat_activity WHERE pid = pg_backend_pid()),
              'application_name', current_setting('application_name'),
              'transaction_read_only', current_setting('transaction_read_only'),
              'server_version', version(),
              'server_version_num', current_setting('server_version_num'),
              'server_addr', inet_server_addr()::text,
              'server_port', inet_server_port(),
              'postmaster_start_time', pg_postmaster_start_time()
            )::text" \
            -c "COMMIT" > attestation-evidence/database-session.json

          python3 - <<'PY'
          import json, os, sys
          with open("attestation-evidence/database-session.json", encoding="utf-8") as f:
              db = json.load(f)
          expected = os.environ["APP_NAME"]
          checks = {
              "application_name_matches_nonce": db.get("application_name") == expected,
              "transaction_is_read_only": db.get("transaction_read_only") == "on",
              "system_identifier_available": bool(db.get("system_identifier")),
              "database_oid_available": bool(db.get("database_oid")),
              "session_pid_available": bool(db.get("backend_pid")),
          }
          if not all(checks.values()):
              print(json.dumps({"checks": checks, "result": "FAIL"}, sort_keys=True))
              sys.exit(1)
          print(json.dumps({"checks": checks, "result": "PASS"}, sort_keys=True))
          PY

          COLLECTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export COLLECTED_AT
          python3 - <<'PY'
          import datetime, json, os, platform, socket
          with open("attestation-evidence/database-session.json", encoding="utf-8") as f:
              database = json.load(f)
          evidence = {
              "format": "ai-phone-02-read-only-attestation",
              "format_version": int(os.environ["ATTESTATION_FORMAT_VERSION"]),
              "workflow": {
                  "name": os.environ.get("GITHUB_WORKFLOW"),
                  "workflow_source_sha": os.environ.get("GITHUB_SHA"),
                  "workflow_ref": os.environ.get("GITHUB_REF"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "event": os.environ.get("GITHUB_EVENT_NAME"),
                  "job_id": os.environ.get("JOB_ID"),
                  "target_sha": os.environ.get("TARGET_SHA"),
                  "checked_out_sha": os.environ.get("CHECKOUT_SHA"),
                  "workflow_version": "1"
              },
              "executor": {
                  "runner_name": os.environ.get("RUNNER_NAME"),
                  "runner_environment": os.environ.get("RUNNER_ENVIRONMENT"),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
                  "host_name": socket.gethostname(),
                  "platform": platform.platform(),
                  "image_os": os.environ.get("ImageOS", "UNAVAILABLE"),
                  "image_version": os.environ.get("ImageVersion", "UNAVAILABLE"),
                  "executor_instance_id": "UNAVAILABLE",
                  "identity_limitations": "Runner name and host metadata are declarative job observations; provider-side job metadata must independently corroborate them. No immutable hosted-runner instance ID is exposed to this workflow."
              },
              "postgres": {
                  "service_id_from_job_context": os.environ.get("SERVICE_CONTAINER_ID"),
                  "service_container_id": os.environ.get("SERVICE_ACTUAL_ID"),
                  "configured_image": os.environ.get("SERVICE_IMAGE"),
                  "image_id": os.environ.get("SERVICE_IMAGE_ID"),
                  "repo_digests": json.loads(os.environ.get("SERVICE_REPO_DIGESTS", "[]")),
                  "provisioning_job_id": os.environ.get("JOB_ID"),
                  "scope": "GitHub Actions service container scoped to this job"
              },
              "database_session": database,
              "nonce": {
                  "value": os.environ["NONCE"],
                  "bits": 256,
                  "encoding": "base64url-without-padding",
                  "expected_application_name": os.environ["APP_NAME"],
                  "observed_application_name": database.get("application_name"),
                  "session_binding_verified": database.get("application_name") == os.environ["APP_NAME"]
              },
              "timestamps_utc": {
                  "started_at": os.environ["STARTED_AT"],
                  "collected_at": os.environ["COLLECTED_AT"]
              },
              "result": "PASS",
              "limitations": [
                  "This artifact is declarative evidence produced by the workflow; independently retrieve and correlate run, attempt, job, logs, artifact metadata, and digest through GitHub.",
                  "The hosted runner has no immutable executor instance identifier exposed to this workflow.",
                  "The PostgreSQL service is pinned to the official linux/amd64 manifest digest; the runtime image ID and repository digest are recorded and must be independently checked."
              ],
              "safety": {
                  "database_operations": ["BEGIN READ ONLY", "SELECT", "COMMIT"],
                  "migrations_executed": False,
                  "schema_modified": False,
                  "data_modified": False,
                  "production_access": False,
                  "permanent_credentials_used": False
              }
          }
          with open("attestation-evidence/attestation.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

          (cd attestation-evidence && sha256sum attestation.json database-session.json > SHA256SUMS)
          echo "Read-only identity checks passed; evidence generated."
          echo "Evidence files:"
          find attestation-evidence -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload read-only attestation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-phone-02-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: attestation-evidence/
          if-no-files-found: warn
          retention-days: 7
