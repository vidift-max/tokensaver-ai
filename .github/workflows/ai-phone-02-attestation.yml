# Deliberately manual-only: no push, pull_request, schedule, or reusable-workflow trigger.
# Dispatch is intended only after this file has been reviewed and merged to the default branch.
name: AI-PHONE-02 Read-only Attestation Channel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-phone-02-attestation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  TARGET_SHA: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
  ATTESTATION_FORMAT_VERSION: "2"

jobs:
  ai-phone-02-attestation:
    name: Read-only PostgreSQL identity attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable AI-PHONE-02 TARGET
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
          fetch-depth: 1
          persist-credentials: false

      - name: Collect read-only provenance and PostgreSQL attestation
        id: collect
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          JOB_KEY: ${{ github.job }}
        run: |
          set -euo pipefail
          mkdir -p attestation-evidence

          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "$EVENT_REF" = "refs/heads/v2-saas-alpha"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$WORKFLOW_REF"
          test "$WORKFLOW_REF" = "vidift-max/tokensaver-ai/.github/workflows/ai-phone-02-attestation.yml@refs/heads/v2-saas-alpha"
          [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$JOB_KEY"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$TARGET_SHA"

          # Start a job-local PostgreSQL instance with an ephemeral SCRAM credential.
          # No host port is published and the container has no external network.
          POSTGRES_IMAGE="postgres:16.16@sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87"
          EXPECTED_IMAGE_DIGEST="sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87"
          # Run-scoped resources; install cleanup before creating any temporary resource.
          SERVICE_CONTAINER_NAME="ai-phone-02-postgres-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SERVICE_CONTAINER_ID=""
          PG_SECRET_DIR=""
          PG_SECRET_FILE=""
          remove_secret_file_verified() {
            rm -f -- "$1" || return 1
            [[ ! -e "$1" && ! -L "$1" ]]
          }
          remove_secret_dir_verified() {
            rmdir -- "$1" 2>/dev/null || return 1
            [[ ! -e "$1" && ! -L "$1" ]]
          }
          cleanup_shell_selftest() {
            test_dir="$(mktemp -d)"
            mkdir "$test_dir/not-a-file"
            if remove_secret_file_verified "$test_dir/not-a-file"; then echo "secret deletion negative test failed"; return 1; fi
            rmdir "$test_dir/not-a-file"
            touch "$test_dir/secret"
            remove_secret_file_verified "$test_dir/secret" || return 1
            remove_secret_dir_verified "$test_dir" || return 1
            test ! -e "$test_dir"
            echo "cleanup_secret_selftest=PASS"
          }
          cleanup_shell_selftest
          cleanup_run_resources() {
            rc=$?
            trap - EXIT
            set +e
            cleanup_failed=0
            if [[ -n "$SERVICE_CONTAINER_ID" ]]; then
              docker info >/dev/null 2>&1 || cleanup_failed=1
              if [[ "$cleanup_failed" -eq 0 ]]; then
                inspect_json="$(docker inspect --type container "$SERVICE_CONTAINER_ID" 2>/dev/null)"
                inspect_rc=$?
                if [[ "$inspect_rc" -eq 0 ]]; then
                  python3 - "$inspect_json" "$SERVICE_CONTAINER_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY' || cleanup_failed=1
import json,sys
def unique(pairs):
 d={}
 for k,v in pairs:
  if k in d: raise ValueError("duplicate key")
  d[k]=v
 return d
def verify_owned(doc,cid,run_id,attempt):
 assert type(doc) is list and len(doc)==1
 c=doc[0]; assert type(c) is dict and c.get("Id")==cid
 cfg=c.get("Config"); assert type(cfg) is dict
 labels=cfg.get("Labels"); assert type(labels) is dict
 assert labels=={"ai-phone-02.run-id":run_id,"ai-phone-02.run-attempt":attempt,"ai-phone-02.managed":"true"}
def selftest():
 cid="a"*64; labels={"ai-phone-02.run-id":"1","ai-phone-02.run-attempt":"2","ai-phone-02.managed":"true"}
 verify_owned([{"Id":cid,"Name":"/renamed","Config":{"Labels":labels}}],cid,"1","2")
 for bad in ([{"Id":"b"*64,"Config":{"Labels":labels}}],[{"Id":cid,"Config":{"Labels":{}}}]):
  try: verify_owned(bad,cid,"1","2")
  except AssertionError: pass
  else: raise AssertionError("ownership negative test passed unexpectedly")
 print("cleanup_identity_selftest=PASS; renamed_id=PASS; id_mismatch=REJECTED; missing_labels=REJECTED")
selftest()
doc=json.loads(sys.argv[1],object_pairs_hook=unique)
verify_owned(doc,sys.argv[2],sys.argv[3],sys.argv[4])
PY
                  if [[ "$cleanup_failed" -eq 0 ]]; then
                    docker rm -f "$SERVICE_CONTAINER_ID" >/dev/null 2>&1 || cleanup_failed=1
                  fi
                else
                  remaining="$(docker ps -aq --no-trunc --filter "id=$SERVICE_CONTAINER_ID" 2>/dev/null)" || cleanup_failed=1
                  [[ -z "$remaining" ]] || cleanup_failed=1
                fi
                if [[ "$cleanup_failed" -eq 0 ]]; then
                  if docker inspect --type container "$SERVICE_CONTAINER_ID" >/dev/null 2>&1; then cleanup_failed=1; fi
                  remaining="$(docker ps -aq --no-trunc --filter "id=$SERVICE_CONTAINER_ID" 2>/dev/null)" || cleanup_failed=1
                  [[ -z "$remaining" ]] || cleanup_failed=1
                fi
              fi
            fi
            if [[ "$cleanup_failed" -eq 0 ]]; then
              if [[ -n "$PG_SECRET_FILE" ]]; then remove_secret_file_verified "$PG_SECRET_FILE" || cleanup_failed=1; fi
              if [[ -n "$PG_SECRET_DIR" ]]; then remove_secret_dir_verified "$PG_SECRET_DIR" || cleanup_failed=1; fi
            else
              echo "Secret retained until ephemeral runner teardown because container removal/ownership was not verified."
            fi
            if [[ "$cleanup_failed" -ne 0 ]]; then echo "Run-scoped cleanup failed verification."; rc=1; fi
            exit "$rc"
          }
          trap cleanup_run_resources EXIT

          umask 077
          PG_SECRET_DIR="$(mktemp -d "$RUNNER_TEMP/ai-phone-02-secret.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.XXXXXX")"
          chmod 0700 "$PG_SECRET_DIR"
          PG_SECRET_FILE="$PG_SECRET_DIR/postgres-passwd"
          PG_PASSWORD="$(openssl rand -hex 32)"
          [[ "$PG_PASSWORD" =~ ^[a-f0-9]{64}$ ]]
          printf '%s' "$PG_PASSWORD" > "$PG_SECRET_FILE"
          chmod 0600 "$PG_SECRET_FILE"
          test "$(stat -c '%a' "$PG_SECRET_DIR")" = "700"
          test "$(stat -c '%a' "$PG_SECRET_FILE")" = "600"
          test -s "$PG_SECRET_FILE"

          SERVICE_CONTAINER_ID="$(docker run --detach --name "$SERVICE_CONTAINER_NAME" \
