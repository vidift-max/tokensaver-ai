# Deliberately manual-only: no push, pull_request, schedule, or reusable-workflow trigger.
# Dispatch is intended only after this file has been reviewed and merged to the default branch.
name: AI-PHONE-02 Read-only Attestation Channel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-phone-02-attestation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  TARGET_SHA: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
  ATTESTATION_FORMAT_VERSION: "2"

jobs:
  ai-phone-02-attestation:
    name: Read-only PostgreSQL identity attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable AI-PHONE-02 TARGET
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
          fetch-depth: 1
          persist-credentials: false

      - name: Collect read-only provenance and PostgreSQL attestation
        id: collect
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          JOB_KEY: ${{ github.job }}
        run: |
          set -euo pipefail
          mkdir -p attestation-evidence

          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "$EVENT_REF" = "refs/heads/v2-saas-alpha"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$WORKFLOW_REF"
          test "$WORKFLOW_REF" = "vidift-max/tokensaver-ai/.github/workflows/ai-phone-02-attestation.yml@refs/heads/v2-saas-alpha"
          [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$JOB_KEY"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$TARGET_SHA"

          # Start a job-local PostgreSQL instance with an ephemeral SCRAM credential.
          # No host port is published and the container has no external network.
          POSTGRES_IMAGE="postgres:16.16@sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87"
          EXPECTED_IMAGE_DIGEST="sha256:2d5c77ae9b0e0944ffb92f8d8fc2fa2edb215cb0976da8bac34df917af417e87"
          # Run-scoped resources; install cleanup before creating any temporary resource.
          SERVICE_CONTAINER_NAME="ai-phone-02-postgres-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SERVICE_CONTAINER_ID=""
          PG_SECRET_DIR=""
          PG_SECRET_FILE=""
          cleanup_run_resources() {
            rc=$?
            trap - EXIT
            set +e
            cleanup_failed=0
            if [[ -n "$SERVICE_CONTAINER_NAME" ]]; then
              docker info >/dev/null 2>&1 || cleanup_failed=1
              if [[ "$cleanup_failed" -eq 0 ]]; then
                matches="$(docker ps -aq --filter "name=^/$SERVICE_CONTAINER_NAME$")" || cleanup_failed=1
                if [[ "$cleanup_failed" -eq 0 && -n "$matches" ]]; then
                  if [[ "$(printf '%s\n' "$matches" | wc -l)" -ne 1 ]]; then
                    echo "Cleanup refused: multiple containers matched this run name."
                    cleanup_failed=1
                  else
                    cid="$(docker inspect --format '{{.Id}}' "$matches" 2>/dev/null)" || cleanup_failed=1
                    labels="$(docker inspect --format '{{ index .Config.Labels "ai-phone-02.run-id" }}|{{ index .Config.Labels "ai-phone-02.run-attempt" }}|{{ index .Config.Labels "ai-phone-02.managed" }}' "$cid" 2>/dev/null)" || cleanup_failed=1
                    if [[ "$cleanup_failed" -eq 0 && "$labels" == "$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|true" && -n "$cid" ]]; then
                      docker rm -f "$cid" >/dev/null 2>&1 || cleanup_failed=1
                    else
                      echo "Cleanup refused: container ownership could not be proven."
                      cleanup_failed=1
                    fi
                  fi
                fi
                remaining="$(docker ps -aq --filter "name=^/$SERVICE_CONTAINER_NAME$")" || cleanup_failed=1
                [[ -z "$remaining" ]] || cleanup_failed=1
              fi
            fi
            if [[ "$cleanup_failed" -eq 0 ]]; then
              if [[ -n "$PG_SECRET_FILE" ]]; then
                rm -f -- "$PG_SECRET_FILE" || cleanup_failed=1
                [[ ! -e "$PG_SECRET_FILE" ]] || cleanup_failed=1
              fi
              if [[ -n "$PG_SECRET_DIR" ]]; then
                rmdir -- "$PG_SECRET_DIR" 2>/dev/null || cleanup_failed=1
                [[ ! -e "$PG_SECRET_DIR" ]] || cleanup_failed=1
              fi
            else
              echo "Secret retained until ephemeral runner teardown because container removal was not verified."
            fi
            if [[ "$cleanup_failed" -ne 0 ]]; then
              echo "Run-scoped cleanup failed verification."
              rc=1
            fi
            exit "$rc"
          }
          trap cleanup_run_resources EXIT

          umask 077
          PG_SECRET_DIR="$(mktemp -d "$RUNNER_TEMP/ai-phone-02-secret.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.XXXXXX")"
          chmod 0700 "$PG_SECRET_DIR"
          PG_SECRET_FILE="$PG_SECRET_DIR/postgres-passwd"
          PG_PASSWORD="$(openssl rand -hex 32)"
          [[ "$PG_PASSWORD" =~ ^[a-f0-9]{64}$ ]]
          printf '%s' "$PG_PASSWORD" > "$PG_SECRET_FILE"
          chmod 0600 "$PG_SECRET_FILE"
          test "$(stat -c '%a' "$PG_SECRET_DIR")" = "700"
          test "$(stat -c '%a' "$PG_SECRET_FILE")" = "600"
          test -s "$PG_SECRET_FILE"

          SERVICE_CONTAINER_ID="$(docker run --detach --name "$SERVICE_CONTAINER_NAME" \
            --label "ai-phone-02.run-id=$GITHUB_RUN_ID" \
            --label "ai-phone-02.run-attempt=$GITHUB_RUN_ATTEMPT" \
            --label "ai-phone-02.managed=true" \
            --network none --read-only --security-opt=no-new-privileges \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g \
            --tmpfs /var/run/postgresql:rw,noexec,nosuid,size=16m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$PG_SECRET_DIR,dst=/run/secrets,readonly" \
            --pids-limit 256 --memory 1g --cpus 1 \
            --health-cmd='pg_isready -U attestation -d attestation' \
            --health-interval=3s --health-timeout=3s --health-retries=20 \
            --env POSTGRES_USER=attestation \
            --env POSTGRES_DB=attestation \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres-passwd \
            --env 'POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256' \
            "$POSTGRES_IMAGE")"
          test -n "$SERVICE_CONTAINER_ID"

          SERVICE_ACTUAL_ID="$(docker inspect --format '{{.Id}}' "$SERVICE_CONTAINER_ID")"
          SERVICE_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$SERVICE_CONTAINER_ID")"
          SERVICE_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$SERVICE_CONTAINER_ID")"
          SERVICE_IMAGE_INSPECT_ID="$(docker image inspect --format '{{.Id}}' "$SERVICE_IMAGE_ID")"
          SERVICE_REPO_DIGESTS="$(docker image inspect --format '{{json .RepoDigests}}' "$SERVICE_IMAGE_ID")"
          export POSTGRES_IMAGE EXPECTED_IMAGE_DIGEST SERVICE_CONTAINER_ID SERVICE_ACTUAL_ID
          export SERVICE_IMAGE SERVICE_IMAGE_ID SERVICE_IMAGE_INSPECT_ID SERVICE_REPO_DIGESTS

          python3 - <<'PY'
          import json, os, re, sys
          repos={"postgres","docker.io/library/postgres","index.docker.io/library/postgres"}
          vals={
            "container_id_format":bool(re.fullmatch(r"[a-f0-9]{64}",os.environ["SERVICE_CONTAINER_ID"])),
            "container_id_matches":os.environ["SERVICE_ACTUAL_ID"]==os.environ["SERVICE_CONTAINER_ID"],
            "configured_image_matches":os.environ["SERVICE_IMAGE"]==os.environ["POSTGRES_IMAGE"],
            "image_id_format":bool(re.fullmatch(r"sha256:[a-f0-9]{64}",os.environ["SERVICE_IMAGE_ID"])),
            "image_inspect_matches":os.environ["SERVICE_IMAGE_INSPECT_ID"]==os.environ["SERVICE_IMAGE_ID"]}
          try: ds=json.loads(os.environ["SERVICE_REPO_DIGESTS"])
          except Exception: ds=None
          vals["expected_digest_present"]=isinstance(ds,list) and any(isinstance(x,str) and "@" in x and x.rsplit("@",1)[0] in repos and x.rsplit("@",1)[1]==os.environ["EXPECTED_IMAGE_DIGEST"] for x in ds)
          vals["repo_digests_present"]=isinstance(ds,list) and bool(ds)
          failed=[k for k,v in vals.items() if not v]
          print(json.dumps({"image_identity_checks":vals,"failed":failed,"result":"PASS" if not failed else "FAIL"},sort_keys=True))
          if failed: sys.exit(1)
          PY

          # Inspect the actual container config and validate it before health checks or SQL.
          docker inspect --type container "$SERVICE_CONTAINER_ID" > "$RUNNER_TEMP/ai-phone-02-container-inspect.json"
          cat > "$RUNNER_TEMP/ai-phone-02-validate-container.py" <<'PY'
          import json, os, sys, stat, tempfile
          SECRET="/run/secrets/postgres-passwd"
          TMPFS={
            "/var/lib/postgresql/data":("rw","noexec","nosuid","size=1073741824"),
            "/var/run/postgresql":("rw","noexec","nosuid","size=16777216"),
            "/tmp":("rw","noexec","nosuid","size=67108864")}
          def check(ok,msg):
            if not ok: raise ValueError(msg)
          def validate_secret(secret_file, secret_dir):
            check(os.path.isdir(secret_dir) and stat.S_IMODE(os.stat(secret_dir).st_mode)==0o700,"secret directory missing or permissions incorrect")
            check(os.path.isfile(secret_file) and not os.path.islink(secret_file),"secret file missing or not a regular file")
            check(stat.S_IMODE(os.stat(secret_file).st_mode)==0o600,"secret file permissions incorrect")
            with open(secret_file,encoding="ascii") as h: value=h.read()
            check(bool(__import__("re").fullmatch(r"[a-f0-9]{64}",value)),"secret missing, empty, or invalid format")
          def validate(doc,e):
            check(isinstance(doc,list) and len(doc)==1,"inspect must return exactly one container")
            c=doc[0]; cfg=c.get("Config"); hc=c.get("HostConfig"); ns=c.get("NetworkSettings")
            check(all(isinstance(x,dict) for x in (cfg,hc,ns)),"required inspect object absent")
            check(c.get("Id")==e["id"] and c.get("Image")==e["image_id"] and cfg.get("Image")==e["image"],"container/image identity mismatch")
            check(hc.get("NetworkMode")=="none","network mode mismatch")
            check(hc.get("PortBindings") in (None,{}),"host ports published")
            check(hc.get("PublishAllPorts") is False,"PublishAllPorts mismatch")
            ports=ns.get("Ports")
            check(isinstance(ports,dict) and all(v in (None,[]) for v in ports.values()),"effective host port binding found or ports unavailable")
            check(hc.get("ReadonlyRootfs") is True and hc.get("Privileged") is False,"rootfs/privileged policy mismatch")
            sec=hc.get("SecurityOpt")
            check(isinstance(sec,list) and "no-new-privileges:true" in sec,"no-new-privileges missing")
            check(hc.get("Memory")==1073741824 and hc.get("NanoCpus")==1000000000 and hc.get("PidsLimit")==256,"resource limits mismatch")
            tmp=hc.get("Tmpfs")
            check(isinstance(tmp,dict) and set(tmp)==set(TMPFS),"tmpfs paths mismatch")
            for p,required in TMPFS.items():
              opts=set(str(tmp[p]).split(","))
              size=required[-1]
              allowed_sizes={size, {"size=1073741824":"size=1g","size=16777216":"size=16m","size=67108864":"size=64m"}[size]}
              check(set(required[:-1]).issubset(opts) and bool(opts.intersection(allowed_sizes)),"tmpfs options mismatch: "+p)
            env=cfg.get("Env")
            check(isinstance(env,list),"Config.Env missing")
            check(not any(x.startswith("POSTGRES_PASSWORD=") for x in env),"POSTGRES_PASSWORD leaked into Config.Env")
            check("POSTGRES_PASSWORD_FILE="+SECRET in env,"password file path missing")
            args=[x.split("=",1)[1] for x in env if x.startswith("POSTGRES_INITDB_ARGS=")]
            check(len(args)==1 and "--auth-host=scram-sha-256" in args[0] and "--auth-local=scram-sha-256" in args[0],"SCRAM initialization policy mismatch")
            mounts=c.get("Mounts")
            check(isinstance(mounts,list),"Mounts missing")
            sm=[m for m in mounts if m.get("Destination")=="/run/secrets"]
            check(len(sm)==1 and sm[0].get("Type")=="bind" and sm[0].get("RW") is False and sm[0].get("Source")==e["secret_dir"],"secret mount absent/writable/unexpected")
            check({m.get("Destination") for m in mounts}==set(TMPFS)|{"/run/secrets"},"unexpected or missing mounts")
            for m in mounts:
              if m.get("Destination") in TMPFS: check(m.get("Type")=="tmpfs" and m.get("RW") is True,"tmpfs mount mismatch")
            labels=cfg.get("Labels")
            check(isinstance(labels,dict) and labels.get("ai-phone-02.run-id")==e["run_id"] and labels.get("ai-phone-02.run-attempt")==e["attempt"] and labels.get("ai-phone-02.managed")=="true","run ownership labels mismatch")
            return {"observed_by":"docker_inspect","container_id":c["Id"],"image_id":c["Image"],"configured_image":cfg["Image"],"network_mode":hc["NetworkMode"],"port_bindings":hc["PortBindings"],"effective_network_ports":ports,"publish_all_ports":hc["PublishAllPorts"],"readonly_rootfs":hc["ReadonlyRootfs"],"security_opt":sec,"memory_bytes":hc["Memory"],"nano_cpus":hc["NanoCpus"],"pids_limit":hc["PidsLimit"],"tmpfs":tmp,"privileged":hc["Privileged"],"mounts":[{"type":m.get("Type"),"destination":m.get("Destination"),"rw":m.get("RW")} for m in mounts],"secret_value_in_config_env":False,"policy_validation":"PASS","trust_limitation":"Docker daemon-reported configuration; does not prove host integrity or protect against a privileged daemon administrator."}
          def selftest():
            tmp={k:",".join(v) for k,v in TMPFS.items()}
            f=[{"Id":"a"*64,"Image":"sha256:"+"b"*64,"Config":{"Image":"postgres:16.16@sha256:"+"c"*64,"Env":["POSTGRES_PASSWORD_FILE="+SECRET,"POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256"],"Labels":{"ai-phone-02.run-id":"1","ai-phone-02.run-attempt":"1","ai-phone-02.managed":"true"}},"HostConfig":{"NetworkMode":"none","PortBindings":{},"PublishAllPorts":False,"ReadonlyRootfs":True,"Privileged":False,"SecurityOpt":["no-new-privileges:true"],"Memory":1073741824,"NanoCpus":1000000000,"PidsLimit":256,"Tmpfs":tmp},"NetworkSettings":{"Ports":{"5432/tcp":None}},"Mounts":[{"Type":"tmpfs","Destination":p,"RW":True} for p in TMPFS]+[{"Type":"bind","Source":"/tmp/sec","Destination":"/run/secrets","RW":False}]}]
            e={"id":"a"*64,"image_id":"sha256:"+"b"*64,"image":"postgres:16.16@sha256:"+"c"*64,"secret_dir":"/tmp/sec","run_id":"1","attempt":"1"}
            validate(f,e)
            with tempfile.TemporaryDirectory() as td:
              os.chmod(td,0o700); secret=os.path.join(td,"postgres-passwd")
              with open(secret,"w",encoding="ascii") as h: h.write("a"*64)
              os.chmod(secret,0o600); validate_secret(secret,td)
              for mode,content in ((0o644,"a"*64),(0o600,""),(0o600,"not-a-secret")):
                with open(secret,"w",encoding="ascii") as h: h.write(content)
                os.chmod(secret,mode)
                try: validate_secret(secret,td)
                except (ValueError,KeyError,TypeError): pass
                else: raise ValueError("invalid secret fixture unexpectedly passed")
              os.remove(secret)
              try: validate_secret(secret,td)
              except (ValueError,KeyError,TypeError): pass
              else: raise ValueError("missing secret fixture unexpectedly passed")
            negatives=0
            mutations=[lambda x:x[0]["HostConfig"].update(NetworkMode="bridge"),lambda x:x[0]["HostConfig"].update(PortBindings={"5432/tcp":[{}]}),lambda x:x[0]["HostConfig"].update(ReadonlyRootfs=False),lambda x:x[0]["HostConfig"].update(SecurityOpt=[]),lambda x:x[0]["HostConfig"].update(Memory=1),lambda x:x[0]["HostConfig"].update(NanoCpus=1),lambda x:x[0]["HostConfig"].update(PidsLimit=1),lambda x:x[0]["Config"]["Env"].append("POSTGRES_PASSWORD=secret"),lambda x:x[0]["Mounts"][-1].update(RW=True),lambda x:x[0]["Mounts"].pop(),lambda x:x[0]["HostConfig"].pop("Tmpfs"),lambda x:x[0]["HostConfig"].update(Privileged=True),lambda x:x[0]["Config"]["Env"].clear()]
            for mutate in mutations:
              x=json.loads(json.dumps(f)); mutate(x)
              try: validate(x,e)
              except (ValueError,KeyError,TypeError): negatives+=1
              else: raise ValueError("negative fixture unexpectedly passed")
            for x in (None,{},[],f+f,[{"Config":{}}]):
              try: validate(x,e)
              except (ValueError,KeyError,TypeError): negatives+=1
              else: raise ValueError("malformed fixture unexpectedly passed")
            print(json.dumps({"validator_self_tests":"PASS","positive":1,"negative":negatives}))
          if __name__=="__main__":
            if len(sys.argv)==2 and sys.argv[1]=="--self-test": selftest(); raise SystemExit(0)
            try:
              validate_secret(os.environ["PG_SECRET_FILE"],os.environ["PG_SECRET_DIR"])
              with open(sys.argv[1],encoding="utf-8") as h: doc=json.load(h)
              e={"id":os.environ["SERVICE_CONTAINER_ID"],"image_id":os.environ["SERVICE_IMAGE_ID"],"image":os.environ["POSTGRES_IMAGE"],"secret_dir":os.environ["PG_SECRET_DIR"],"run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"]}
              result=validate(doc,e)
              with open(sys.argv[2],"w",encoding="utf-8") as h: json.dump(result,h,indent=2,sort_keys=True); h.write("\n")
              print('{"effective_container_policy":"PASS"}')
            except Exception as ex:
              print(json.dumps({"effective_container_policy":"FAIL","error":type(ex).__name__},sort_keys=True)); raise SystemExit(1)
          PY
          python3 "$RUNNER_TEMP/ai-phone-02-validate-container.py" --self-test
          export PG_SECRET_DIR PG_SECRET_FILE
          python3 "$RUNNER_TEMP/ai-phone-02-validate-container.py" "$RUNNER_TEMP/ai-phone-02-container-inspect.json" "$RUNNER_TEMP/ai-phone-02-container-observed.json"
          export CONTAINER_OBSERVED_JSON="$RUNNER_TEMP/ai-phone-02-container-observed.json"

          # Fail closed unless the isolated PostgreSQL instance is healthy.
          HEALTH_STATUS=""
          for attempt in $(seq 1 60); do
            HEALTH_STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$SERVICE_CONTAINER_ID")"
            [[ "$HEALTH_STATUS" == "healthy" ]] && break
            [[ "$HEALTH_STATUS" == "unhealthy" ]] && { echo "PostgreSQL health check failed."; exit 1; }
            sleep 1
          done
          test "$HEALTH_STATUS" = "healthy"

          NONCE="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          test "$(printf '%s' "$NONCE" | wc -c)" -eq 43
          APP_NAME="ai-phone-02-$NONCE"
          export NONCE APP_NAME CHECKOUT_SHA STARTED_AT

          # TCP loopback is confined to the service container; no host port is published.
          docker exec -i -e PGAPPNAME="$APP_NAME" "$SERVICE_CONTAINER_ID" \
            sh -c 'IFS= read -r PGPASSWORD; export PGPASSWORD; exec psql -h 127.0.0.1 -p 5432 -U attestation -d attestation -X -qAt -v ON_ERROR_STOP=1 "$@"' psql \
            -c "BEGIN READ ONLY" \
            -c "SELECT json_build_object(
              'system_identifier', (SELECT system_identifier::text FROM pg_control_system()),
              'system_identifier_repeat', (SELECT system_identifier::text FROM pg_control_system()),
              'system_identifier_method', 'pg_control_system() -> system_identifier (PostgreSQL control-file metadata)',
              'database_name', current_database(),
              'database_oid', (SELECT oid::text FROM pg_database WHERE datname = current_database()),
              'role', current_user,
              'session_user', session_user,
              'is_superuser', current_setting('is_superuser'),
              'backend_pid', pg_backend_pid(),
              'backend_start', (SELECT backend_start::text FROM pg_stat_activity WHERE pid = pg_backend_pid()),
              'application_name', current_setting('application_name'),
              'transaction_read_only', current_setting('transaction_read_only'),
              'server_version', version(),
              'server_version_num', current_setting('server_version_num'),
              'server_addr', inet_server_addr()::text,
              'server_port', inet_server_port(),
              'postmaster_start_time', pg_postmaster_start_time()
            )::text" \
            -c "COMMIT" <<< "$PG_PASSWORD" > attestation-evidence/database-session.json

          unset PG_PASSWORD
          export EVENT_SHA EVENT_REF WORKFLOW_REF WORKFLOW_SHA CHECK_RUN_ID JOB_KEY
          python3 - <<'PY'
          import json, os, re, sys
          with open("attestation-evidence/database-session.json", encoding="utf-8") as f:
              db = json.load(f)

          expected_app = os.environ["APP_NAME"]
          def valid_system_identifier(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9]{1,19}", value):
                  return False
              number = int(value)
              return number > 0 and number <= (2**63 - 1) and str(number) == value

          required = {
              "database_name": db.get("database_name") == "attestation",
              "database_oid": bool(re.fullmatch(r"[0-9]+", str(db.get("database_oid", "")))),
              "role": db.get("role") == "attestation",
              "session_user": db.get("session_user") == "attestation",
              "bootstrap_role_superuser": db.get("is_superuser") == "on",
              "backend_pid": isinstance(db.get("backend_pid"), int) and db["backend_pid"] > 0,
              "backend_start": bool(db.get("backend_start")),
              "application_name_nonce": db.get("application_name") == expected_app,
              "transaction_read_only": db.get("transaction_read_only") == "on",
              "server_version": bool(db.get("server_version")),
              "server_version_num": bool(re.fullmatch(r"[0-9]+", str(db.get("server_version_num", "")))),
              "server_addr": db.get("server_addr") == "127.0.0.1",
              "server_port": db.get("server_port") == 5432,
              "postmaster_start_time": bool(db.get("postmaster_start_time")),
              "system_identifier_present": valid_system_identifier(db.get("system_identifier")),
              "system_identifier_repeat_present": valid_system_identifier(db.get("system_identifier_repeat")),
              "system_identifier_method": db.get("system_identifier_method") == "pg_control_system() -> system_identifier (PostgreSQL control-file metadata)",
              "system_identifier_same_session_consistency": db.get("system_identifier") == db.get("system_identifier_repeat"),
          }
          provenance = {
              "event_sha": bool(re.fullmatch(r"[a-f0-9]{40}", os.environ["EVENT_SHA"])),
              "event_ref": os.environ["EVENT_REF"] == "refs/heads/v2-saas-alpha",
              "workflow_ref": bool(os.environ["WORKFLOW_REF"]),
              "workflow_sha": bool(re.fullmatch(r"[a-f0-9]{40}", os.environ["WORKFLOW_SHA"])),
              "check_run_id": bool(re.fullmatch(r"[0-9]+", os.environ["CHECK_RUN_ID"])),
              "job_key": bool(os.environ["JOB_KEY"]),
              "target_sha": os.environ["CHECKOUT_SHA"] == os.environ["TARGET_SHA"],
          }
          checks = {"database": required, "provenance": provenance}
          failed = [f"{group}.{name}" for group, values in checks.items() for name, ok in values.items() if not ok]
          print(json.dumps({"checks": checks, "failed": failed, "result": "FAIL" if failed else "LOCAL_CONTROLS_VALIDATED"}, sort_keys=True))
          if failed:
              sys.exit(1)
          PY

          COLLECTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export COLLECTED_AT
          python3 - <<'PY'
          import json, os, platform, socket
          with open("attestation-evidence/database-session.json", encoding="utf-8") as f:
              database = json.load(f)
          evidence = {
              "format": "ai-phone-02-read-only-attestation",
              "format_version": int(os.environ["ATTESTATION_FORMAT_VERSION"]),
              "workflow": {
                  "name": os.environ.get("GITHUB_WORKFLOW"),
                  "event_sha": os.environ["EVENT_SHA"],
                  "event_ref": os.environ["EVENT_REF"],
                  "workflow_ref": os.environ["WORKFLOW_REF"],
                  "workflow_sha": os.environ["WORKFLOW_SHA"],
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "event": os.environ.get("GITHUB_EVENT_NAME"),
                  "job_key": os.environ["JOB_KEY"],
                  "check_run_id": os.environ["CHECK_RUN_ID"],
                  "job_id": "UNAVAILABLE_PENDING_EXTERNAL_CORRELATION",
                  "job_id_source": "external_github_metadata",
                  "target_sha": os.environ["TARGET_SHA"],
                  "checked_out_sha": os.environ["CHECKOUT_SHA"]
              },
              "executor": {
                  "runner_name": os.environ.get("RUNNER_NAME"),
                  "runner_environment": os.environ.get("RUNNER_ENVIRONMENT"),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
                  "host_name": socket.gethostname(),
                  "platform": platform.platform(),
                  "image_os": os.environ.get("ImageOS", "UNAVAILABLE"),
                  "image_version": os.environ.get("ImageVersion", "UNAVAILABLE"),
                  "executor_instance_id": "UNAVAILABLE",
                  "identity_limitations": "Runner instance identity must be independently correlated from GitHub provider-side job metadata."
              },
              "postgres": {
                  "service_container_id_from_docker_run": os.environ["SERVICE_CONTAINER_ID"],
                  "service_container_id": os.environ["SERVICE_ACTUAL_ID"],
                  "configured_image": os.environ["SERVICE_IMAGE"],
                  "image_id": os.environ["SERVICE_IMAGE_ID"],
                  "image_inspect_id": os.environ["SERVICE_IMAGE_INSPECT_ID"],
                  "expected_registry_digest": os.environ["EXPECTED_IMAGE_DIGEST"],
                  "repo_digests": json.loads(os.environ["SERVICE_REPO_DIGESTS"]),
                  "image_digest_validation": "passed against docker image inspect of the immutable image ID",
                  "container_configuration": json.load(open(os.environ["CONTAINER_OBSERVED_JSON"], encoding="utf-8")),
                  "host_auth_method": "scram-sha-256",
                  "local_auth_method": "scram-sha-256",
                  "credential": "random per-run 256-bit password supplied through POSTGRES_PASSWORD_FILE; secret file retained until verified container removal and excluded from artifact",
                  "scope": "Docker container created within this GitHub-hosted job; TCP connection is loopback inside that container"
              },
              "cluster_identity": {
                  "system_identifier": database["system_identifier"],
                  "repeat_read": database["system_identifier_repeat"],
                  "method": database["system_identifier_method"],
                  "source": "pg_control_system() on the connected PostgreSQL server",
                  "consistency_check": "Two pg_control_system() reads in the same psql TCP session and read-only transaction matched exactly",
                  "database_name": database["database_name"],
                  "database_oid": database["database_oid"],
                  "server_address": database["server_addr"],
                  "server_port": database["server_port"],
                  "postmaster_start_time": database["postmaster_start_time"],
                  "service_container_id": os.environ["SERVICE_ACTUAL_ID"],
                  "relationship": "The pg_control_system() result was returned by the same PostgreSQL backend session connected over 127.0.0.1:5432 inside this identified service container; database identity and backend identity are recorded in database_session."
              },
              "database_session": database,
              "nonce": {
                  "value": os.environ["NONCE"],
                  "bits": 256,
                  "encoding": "base64url-without-padding",
                  "expected_application_name": os.environ["APP_NAME"],
                  "observed_application_name": database["application_name"],
                  "session_binding_verified": database["application_name"] == os.environ["APP_NAME"]
              },
              "timestamps_utc": {
                  "started_at": os.environ["STARTED_AT"],
                  "collected_at": os.environ["COLLECTED_AT"]
              },
              "result": "LOCAL_CONTROLS_VALIDATED_PENDING_PACKAGE_INTEGRITY",
              "local_controls": "VALIDATED_PENDING_PACKAGE_INTEGRITY",
              "external_attestation": "NOT_VALIDATED",
              "provider_side_correlation": "PENDING_FUTURE_AUTHORIZED_EXECUTION",
              "limitations": [
                  "This manifest is workflow-produced evidence, not an independently validated attestation.",
                  "Numeric GitHub job ID and runner instance identity require external GitHub metadata correlation.",
                  "Provider-side correlation remains pending until a future separately authorized execution and independent review.",
                  "Cluster identity is collected from pg_control_system() in the connected PostgreSQL session and must be present, positive, in bigint range, and identical across two reads before LOCAL_CONTROLS_PASS.",
                  "The disposable PostgreSQL bootstrap role is a superuser because pg_control_system() requires privileged access; the instance is job-local, network-isolated, has no published ports, uses a per-run random password and is not connected to production.",
                  "Both host and local connections require SCRAM-SHA-256 password authentication.",
                  "Container and image identity checks are completed before any PostgreSQL connection or identity collection."
              ],
              "safety": {
                  "database_operations": ["BEGIN READ ONLY", "SELECT", "COMMIT"],
                  "database_role_is_superuser": database["is_superuser"] == "on",
                  "migrations_executed": False,
                  "schema_modified": False,
                  "data_modified": False,
                  "production_access": False,
                  "permanent_credentials_used": False
              }
          }
          with open("attestation-evidence/attestation.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

          test -s attestation-evidence/attestation.json
          test -s attestation-evidence/database-session.json
          (cd attestation-evidence && sha256sum attestation.json database-session.json > SHA256SUMS)
          test -s attestation-evidence/SHA256SUMS
          (cd attestation-evidence && sha256sum --check SHA256SUMS)
          echo "LOCAL_CONTROLS_PASS: all local controls and package integrity verified; external attestation remains NOT_VALIDATED."

      - name: Upload read-only attestation evidence
        if: success() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-phone-02-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: attestation-evidence/
          if-no-files-found: error
          retention-days: 7
