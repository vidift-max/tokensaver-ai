name: AI-PHONE-01 Final Validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact implementation SHA to validate'
        required: true
        default: '673ef169709dbfea906128205f0fd544df0555a3'
        type: string

permissions:
  contents: read

jobs:
  final-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_phone_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ai_phone_isolation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_phone_ci -d ai_phone_isolation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://ai_phone_ci:disposable-ci-only@localhost:5432/ai_phone_isolation_test

    steps:
      - name: Checkout exact implementation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact implementation SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.target_sha }}"
          echo "Validated implementation SHA: $actual"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm PostgreSQL 16
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT version(); SELECT current_setting('server_version_num');"

      - name: Rust formatting diagnostic
        continue-on-error: true
        run: cargo fmt --manifest-path services/ai-team-room/Cargo.toml -- --check

      - name: Cargo check
        run: cargo check --manifest-path services/ai-team-room/Cargo.toml

      - name: Real legacy migration validation
        run: bash services/ai-team-room/tests/ai_phone_legacy_migration.sh

      - name: PostgreSQL integration and adversarial tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path services/ai-team-room/Cargo.toml -- --show-output 2>&1 | tee ai-phone-01-final-tests.log

      - name: Frontend production build
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TARGET_SHA=${{ inputs.target_sha }}"
            git rev-parse HEAD
            sha256sum \
              services/ai-team-room/migrations/0012_ai_phone_tenant_isolation.sql \
              services/ai-team-room/src/phone.rs \
              services/ai-team-room/src/handoffs.rs \
              services/ai-team-room/tests/phone_postgres.rs \
              services/ai-team-room/tests/ai_phone_legacy_migration.sh \
              src/AIPhone.tsx \
              src/TeamRoom.tsx \
              src/styles.css
          } | tee ai-phone-01-final-manifest.txt

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-01-final-validation-${{ github.run_id }}
          path: |
            ai-phone-01-final-tests.log
            ai-phone-01-final-manifest.txt
          if-no-files-found: warn
          retention-days: 14
