name: Distributed Runner PostgreSQL Lab

on:
  push:
    branches: [v2-saas-alpha]
  pull_request:
    branches: [v2-saas-alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributed-runner-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-distributed-runner:
    name: PostgreSQL 16 + Team Room + independent Runner processes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team_room
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: team_room_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team_room -d team_room_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://team_room:ci-only-password@127.0.0.1:5432/team_room_test
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
      - name: Wait for PostgreSQL 16
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U team_room -d team_room_test; then exit 0; fi
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 5432 -U team_room -d team_room_test
      - name: Run Rust PostgreSQL lease and fencing integration test
        id: rust_integration
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p distributed-runner-evidence
          printf 'commit=%s\ntest=Rust PostgreSQL lease concurrency\n' "$GITHUB_SHA" > distributed-runner-evidence/test.log
          set +e
          cargo test --manifest-path services/ai-team-room/Cargo.toml ten_concurrent_executors_one_winner_then_expiry_reassignment_and_old_fence_rejection -- --nocapture 2>&1 | tee -a distributed-runner-evidence/test.log
          result=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$result" >> distributed-runner-evidence/test.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build real Team Room service
        id: service_build
        if: always()
        shell: bash
        run: |
          set +e
          cargo build --manifest-path services/ai-team-room/Cargo.toml 2>&1 | tee -a distributed-runner-evidence/test.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> distributed-runner-evidence/test.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run two independent Mission Runner processes against shared PostgreSQL
        id: process_e2e
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ steps.service_build.outputs.exit_code }}" != "0" ] || [ ! -x services/ai-team-room/target/debug/ai-team-room-service ]; then
            echo "Team Room binary unavailable; distributed process proof not run." | tee -a distributed-runner-evidence/test.log
            echo "exit_code=99" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUST_LOG=info TEAM_ROOM_BIND=127.0.0.1:8081 ./services/ai-team-room/target/debug/ai-team-room-service > distributed-runner-evidence/team-room-service.log 2>&1 &
          SERVICE_PID=$!
          trap 'kill "$SERVICE_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/health/live >/dev/null && curl --fail --silent http://127.0.0.1:8081/health/ready >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Team Room readiness failed." | tee -a distributed-runner-evidence/test.log
            echo "exit_code=98" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --show-error http://127.0.0.1:8081/health/live
          curl --fail --show-error http://127.0.0.1:8081/health/ready
          set +e
          TEAM_ROOM_API_URL=http://127.0.0.1:8081 DISTRIBUTED_EVIDENCE_DIR=distributed-runner-evidence node scripts/distributed-runner-process-e2e.mjs 2>&1 | tee -a distributed-runner-evidence/test.log
          result=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$result" >> distributed-runner-evidence/test.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Consolidate evidence and enforce every proof gate
        if: always()
        env:
          RUST_EXIT: ${{ steps.rust_integration.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.service_build.outputs.exit_code }}
          PROCESS_EXIT: ${{ steps.process_e2e.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          process_evidence=null
          if [ -f distributed-runner-evidence/runner-process-evidence.json ]; then
            process_evidence="$(cat distributed-runner-evidence/runner-process-evidence.json)"
          fi
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --argjson rust_exit "${RUST_EXIT:-99}" \
            --argjson build_exit "${BUILD_EXIT:-99}" \
            --argjson process_exit "${PROCESS_EXIT:-99}" \
            --argjson process "$process_evidence" \
            '{
              commit_sha:$sha,
              workflow:"Distributed Runner PostgreSQL Lab",
              database:"PostgreSQL 16 shared service container",
              team_room:"real Axum service process",
              rust_postgres_integration:{exit_code:$rust_exit,result:(if $rust_exit==0 then "PASS" else "FAIL_OR_NOT_RUN" end)},
              team_room_build:{exit_code:$build_exit,result:(if $build_exit==0 then "PASS" else "FAIL_OR_NOT_RUN" end)},
              independent_runner_processes:{exit_code:$process_exit,result:(if $process_exit==0 and $process!=null then "PASS" else "FAIL_OR_NOT_RUN" end)},
              runner_process_evidence:$process,
              result:(if $rust_exit==0 and $build_exit==0 and $process_exit==0 and $process!=null and $process.result=="PASS" then "PASS" else "FAIL" end)
            }' > distributed-runner-evidence/distributed-runner-evidence.json
          cat distributed-runner-evidence/distributed-runner-evidence.json
      - name: Upload PostgreSQL distributed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-runner-postgres-evidence-${{ github.run_id }}
          path: distributed-runner-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail workflow unless every integration proof passed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f distributed-runner-evidence/distributed-runner-evidence.json
          jq -e '.result == "PASS"' distributed-runner-evidence/distributed-runner-evidence.json
