name: AI-PHONE-02C Independent Dynamic Audit

on:
  push:
    branches:
      - audit/ai-phone-02c-execution

permissions:
  contents: read

concurrency:
  group: ai-phone-02c-dynamic-audit
  cancel-in-progress: false

jobs:
  dynamic-audit:
    name: Exact-SHA HTTP + PostgreSQL + WebSocket audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_phone_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ai_phone_02c_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_phone_ci -d ai_phone_02c_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ai_phone_ci:disposable-ci-only@localhost:5432/ai_phone_02c_audit
      TARGET_SHA: ebb8eeecfea087443c5f3eba7021e96cb5302fe7
    steps:
      - name: Checkout audit harness and workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-harness
          fetch-depth: 0

      - name: Checkout immutable implementation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0

      - name: Verify exact implementation and harness provenance
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          communication_blob="$(git -C target rev-parse "$TARGET_SHA:services/ai-team-room/src/communication.rs")"
          tasks_blob="$(git -C target rev-parse "$TARGET_SHA:services/ai-team-room/src/tasks.rs")"
          handoffs_blob="$(git -C target rev-parse "$TARGET_SHA:services/ai-team-room/src/handoffs.rs")"
          test "$communication_blob" = "4a89ffd34fe78a8b68fd7ed2c83ed43f18b6eb65"
          test "$tasks_blob" = "b6bd7f33d7a1bcad943060c09b38ec9dcf612819"
          test "$handoffs_blob" = "f6736c77ef66d8c85c1c1ddb261d96649638761e"
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "TARGET_HEAD=$actual"
            echo "COMMUNICATION_SOURCE_BLOB_SHA=$communication_blob"
            echo "TASKS_SOURCE_BLOB_SHA=$tasks_blob"
            echo "HANDOFFS_SOURCE_BLOB_SHA=$handoffs_blob"
            echo "HARNESS_SHA=$(git -C audit-harness rev-parse HEAD)"
            echo "WORKFLOW_SHA=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "EVENT=$GITHUB_EVENT_NAME"
          } | tee ai-phone-02c-run-context.txt
          {
            echo "COMMUNICATION_SOURCE_BLOB_SHA=$communication_blob"
            echo "TASKS_SOURCE_BLOB_SHA=$tasks_blob"
            echo "HANDOFFS_SOURCE_BLOB_SHA=$handoffs_blob"
            echo "HARNESS_SHA=$(git -C audit-harness rev-parse HEAD)"
            echo "AUDIT_EVIDENCE_DIR=$GITHUB_WORKSPACE/audit-evidence"
          } >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/audit-evidence"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm PostgreSQL 16 disposable database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT version(); SELECT current_setting('server_version_num'); SELECT current_setting('transaction_read_only');"

      - name: Inject audit-only HTTP test into exact target worktree
        run: |
          set -euo pipefail
          install -D audit-harness/services/ai-team-room/tests/ai_phone_02c_network.rs \
            target/services/ai-team-room/tests/ai_phone_02c_network.rs
          rustfmt --edition 2021 target/services/ai-team-room/tests/ai_phone_02c_network.rs

      - name: Cargo check exact implementation
        working-directory: target
        run: cargo check --manifest-path services/ai-team-room/Cargo.toml

      - name: Legacy migration compatibility on PostgreSQL 16
        working-directory: target
        run: bash services/ai-team-room/tests/ai_phone_legacy_migration.sh

      - name: Full exact-SHA PostgreSQL, Registry, scale, Team Room and WebSocket suite
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path services/ai-team-room/Cargo.toml -- --show-output 2>&1 | tee ../ai-phone-02c-full-suite.log

      - name: PostgreSQL 16 catalog audit (always, including failed security tests)
        if: always()
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '{"catalog":"server"}'
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT jsonb_build_object('server_version',current_setting('server_version'),'server_version_num',current_setting('server_version_num'),'database',current_database())"
            echo '{"catalog":"constraints"}'
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT jsonb_build_object(
                'table',format('%I.%I',ns.nspname,cl.relname),
                'constraint',co.conname,
                'type',CASE co.contype WHEN 'p' THEN 'PRIMARY KEY' WHEN 'f' THEN 'FOREIGN KEY' WHEN 'u' THEN 'UNIQUE' WHEN 'c' THEN 'CHECK' WHEN 'x' THEN 'EXCLUSION' ELSE co.contype::text END,
                'definition',pg_get_constraintdef(co.oid,true),
                'on_delete',CASE co.confdeltype WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE' WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' ELSE NULL END,
                'set_null_columns',CASE WHEN co.confdeltype='n' AND co.confdelsetcols IS NOT NULL THEN
                  (SELECT jsonb_agg(att.attname ORDER BY att.attnum) FROM unnest(co.confdelsetcols) x(attnum) JOIN pg_attribute att ON att.attrelid=co.conrelid AND att.attnum=x.attnum)
                  ELSE NULL END
              )
              FROM pg_constraint co
              JOIN pg_class cl ON cl.oid=co.conrelid
              JOIN pg_namespace ns ON ns.oid=cl.relnamespace
              WHERE ns.nspname='public' AND co.contype IN ('p','f','u','c','x')
              ORDER BY cl.relname,co.conname"
            echo '{"catalog":"tables_and_columns"}'
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT jsonb_build_object(
                'table',format('%I.%I',ns.nspname,cl.relname),
                'column',att.attname,
                'type',format_type(att.atttypid,att.atttypmod),
                'not_null',att.attnotnull,
                'default',pg_get_expr(def.adbin,def.adrelid),
                'outbound_fk_count',(SELECT count(*) FROM pg_constraint f WHERE f.conrelid=cl.oid AND f.contype='f'),
                'inbound_fk_count',(SELECT count(*) FROM pg_constraint f WHERE f.confrelid=cl.oid AND f.contype='f')
              )
              FROM pg_class cl
              JOIN pg_namespace ns ON ns.oid=cl.relnamespace
              JOIN pg_attribute att ON att.attrelid=cl.oid AND att.attnum>0 AND NOT att.attisdropped
              LEFT JOIN pg_attrdef def ON def.adrelid=cl.oid AND def.adnum=att.attnum
              WHERE ns.nspname='public' AND cl.relkind IN ('r','p')
              ORDER BY cl.relname,att.attnum"
            echo '{"catalog":"triggers"}'
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT jsonb_build_object(
                'table',format('%I.%I',ns.nspname,cl.relname),
                'trigger',tg.tgname,
                'definition',pg_get_triggerdef(tg.oid,true),
                'function',pg_get_functiondef(tg.tgfoid)
              )
              FROM pg_trigger tg
              JOIN pg_class cl ON cl.oid=tg.tgrelid
              JOIN pg_namespace ns ON ns.oid=cl.relnamespace
              WHERE ns.nspname='public' AND NOT tg.tgisinternal
              ORDER BY cl.relname,tg.tgname"
          } | tee ../ai-phone-02c-postgres-catalog.jsonl

      - name: Frontend production build from exact implementation tree
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build 2>&1 | tee ../ai-phone-02c-frontend.log

      - name: Build reproducibility and evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "TARGET_HEAD=$(git -C target rev-parse HEAD)"
            echo "HARNESS_SHA=$(git -C audit-harness rev-parse HEAD)"
            echo "WORKFLOW_SHA=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "WORKFLOW_REF=$GITHUB_REF"
            echo "POSTGRESQL:"
            psql "$DATABASE_URL" -Atc "SELECT version();" || true
            echo "SHA256:"
            find target/services/ai-team-room/migrations target/services/ai-team-room/src target/services/ai-team-room/tests audit-harness/services/ai-team-room/tests \
              -type f \( -name '*.sql' -o -name '*.rs' -o -name '*.sh' \) -print0 | sort -z | xargs -0 sha256sum
          } | tee ai-phone-02c-evidence-manifest.txt

      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-02c-dynamic-audit-${{ github.run_id }}
          path: |
            ai-phone-02c-run-context.txt
            ai-phone-02c-full-suite.log
            ai-phone-02c-postgres-catalog.jsonl
            ai-phone-02c-frontend.log
            ai-phone-02c-evidence-manifest.txt
            audit-evidence/*.jsonl
            audit-harness/services/ai-team-room/tests/ai_phone_02c_network.rs
            audit-harness/.github/workflows/ai-phone-02c-dynamic-audit.yml
          if-no-files-found: warn
          retention-days: 30
