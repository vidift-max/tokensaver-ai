name: Phone-02 Credential Store / Round 3
on:
  push:
    branches: [mission/phone-02-p238-b-oidc]
    paths:
      - 'services/phone-supervisor/credential-store-r3/**'
      - '.github/workflows/phone-02-credential-store-r3.yml'
  workflow_dispatch:
jobs:
  credential-store-r3:
    name: Windows x64 DPAPI-NG LocalService
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mission/phone-02-p238-b-oidc
      - name: Compile x64 harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-r3 | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE services/phone-supervisor/credential-store-r3/CredentialStoreR3.cpp /link /OUT:build-r3/CredentialStoreR3.exe ncrypt.lib bcrypt.lib advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
      - name: Install temporary LocalService with real Service SID
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\Phone02CredentialStoreR3'
          New-Item -ItemType Directory -Force $root | Out-Null
          icacls $root /grant 'NT AUTHORITY\LOCAL SERVICE:(OI)(CI)F' | Out-Null
          Copy-Item build-r3\CredentialStoreR3.exe "$root\CredentialStoreR3.exe"
          sc.exe create TokenSaverPhone02Supervisor binPath= "$root\CredentialStoreR3.exe" start= demand obj= "NT AUTHORITY\LocalService"
          if ($LASTEXITCODE -ne 0) { throw 'SCM_CREATE_FAILED' }
          sc.exe sidtype TokenSaverPhone02Supervisor unrestricted
          if ($LASTEXITCODE -ne 0) { throw 'SCM_SIDTYPE_FAILED' }
          sc.exe start TokenSaverPhone02Supervisor
          if ($LASTEXITCODE -ne 0) { throw 'SCM_START_FAILED' }
          Start-Sleep -Seconds 3
          Get-Content "$root\result.txt"
          $r = Get-Content "$root\result.txt" -Raw
          foreach ($p in @('TOKEN_USER=S-1-5-19','SERVICE_SID=ENABLED','TOKEN_IS_APPCONTAINER=0','WRITE=PASS','READ=PASS','REPLACE=PASS','READ_NEW=PASS','VERIFY_OLD_NOT_CURRENT=PASS','REMOVE=PASS','READ_AFTER_REMOVE=PASS','MISSING_CREDENTIAL=PASS')) {
            if (-not $r.Contains($p)) { throw "POSITIVE_PROOF_MISSING: $p" }
          }
      - name: Negative token separation
        shell: pwsh
        run: |
          throw 'COMMON_PROCESS_AND_REAL_APPCONTAINER_PROBES_NOT_IMPLEMENTED'
      - name: Cleanup and post-cleanup
        if: always()
        shell: pwsh
        run: |
          sc.exe stop TokenSaverPhone02Supervisor 2>$null
          sc.exe delete TokenSaverPhone02Supervisor 2>$null
          Start-Sleep -Seconds 2
          Remove-Item 'C:\ProgramData\Phone02CredentialStoreR3' -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path 'C:\ProgramData\Phone02CredentialStoreR3') { throw 'POST_CLEANUP_FAILED' }
          New-Item -ItemType Directory -Force out-r3 | Out-Null
          'POST_CLEANUP=PASS' | Set-Content out-r3\summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone02-credential-store-r3-sanitized
          path: out-r3/
          if-no-files-found: warn
          retention-days: 7
