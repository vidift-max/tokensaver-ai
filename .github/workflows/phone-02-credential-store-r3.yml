name: Phone-02 Credential Store / Round 3
# R3 isolated workflow: trigger validation after legacy path-filter correction.
on:
  push:
    branches: [mission/phone-02-p238-b-oidc]
    paths:
      - 'services/phone-supervisor/credential-store-r3/**'
      - '.github/workflows/phone-02-credential-store-r3.yml'
  workflow_dispatch:
jobs:
  credential-store-r3:
    name: Windows x64 DPAPI-NG LocalService
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Initialize MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile x64 harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-r3 | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE services/phone-supervisor/credential-store-r3/CredentialStoreR3.cpp /link /OUT:build-r3/CredentialStoreR3.exe ncrypt.lib bcrypt.lib advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
      - name: Install temporary LocalService with real Service SID
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\Phone02CredentialStoreR3'
          New-Item -ItemType Directory -Force $root | Out-Null
          icacls $root /grant 'NT AUTHORITY\LOCAL SERVICE:(OI)(CI)F' | Out-Null
          Copy-Item build-r3\CredentialStoreR3.exe "$root\CredentialStoreR3.exe"
          sc.exe create TokenSaverPhone02Supervisor binPath= "$root\CredentialStoreR3.exe" start= demand obj= "NT AUTHORITY\LocalService"
          if ($LASTEXITCODE -ne 0) { throw 'SCM_CREATE_FAILED' }
          sc.exe sidtype TokenSaverPhone02Supervisor unrestricted
          if ($LASTEXITCODE -ne 0) { throw 'SCM_SIDTYPE_FAILED' }
          sc.exe start TokenSaverPhone02Supervisor
          if ($LASTEXITCODE -ne 0) { throw 'SCM_START_FAILED' }
          Start-Sleep -Seconds 3
          Get-Content "$root\result.txt"
          $r = Get-Content "$root\result.txt" -Raw
          foreach ($p in @('TOKEN_USER=S-1-5-19','SERVICE_SID=ENABLED','TOKEN_IS_APPCONTAINER=0','LOCAL_SERVICE=PASS','SERVICE_SID=PASS','DPAPI_NG=PASS','AUTHORIZED_ACCESS=PASS','STORE_ACL=PASS','WRITE=PASS','READ=PASS','REPLACE=PASS','READ_NEW=PASS','VERIFY_OLD_NOT_CURRENT=PASS','REMOVE=PASS','READ_AFTER_REMOVE=PASS','MISSING_CREDENTIAL=PASS')) {
            if (-not $r.Contains($p)) { throw "POSITIVE_PROOF_MISSING: $p" }
          }
      - name: Negative token separation (common process, NetworkService, real AppContainer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\Phone02CredentialStoreR3'
          $exe = Join-Path $root 'CredentialStoreR3.exe'
          $probe = Join-Path $root 'probe.bin'
          if (-not (Test-Path $probe)) { throw 'PROBE_BLOB_MISSING' }
          icacls $root /grant 'NT AUTHORITY\NETWORK SERVICE:(RX)' | Out-Null
          icacls $probe /grant 'NT AUTHORITY\NETWORK SERVICE:(R)' | Out-Null
          icacls $exe /grant 'NT AUTHORITY\NETWORK SERVICE:(RX)' | Out-Null
          icacls $probe /grant 'BUILTIN\Users:(R)' | Out-Null
          & $exe --probe-common
          if ($LASTEXITCODE -ne 0) { throw "COMMON_PROCESS_DPAPI_NG_REJECT_FAILED: $LASTEXITCODE" }
          'COMMON_PROCESS_REJECT=PASS' | Add-Content "$root\result.txt"
          $networkResult = Join-Path $root 'network-probe.result'
          New-Item -ItemType File -Force $networkResult | Out-Null
          icacls $networkResult /grant 'NT AUTHORITY\NETWORK SERVICE:(M)' | Out-Null
          $networkBin = '"' + $exe + '" --network-service'
          sc.exe create TokenSaverPhone02NetworkProbe binPath= $networkBin start= demand obj= 'NT AUTHORITY\NetworkService'
          if ($LASTEXITCODE -ne 0) { throw 'NETWORKSERVICE_SCM_CREATE_FAILED' }
          sc.exe sidtype TokenSaverPhone02NetworkProbe unrestricted
          if ($LASTEXITCODE -ne 0) { throw 'NETWORKSERVICE_SIDTYPE_FAILED' }
          sc.exe start TokenSaverPhone02NetworkProbe
          if ($LASTEXITCODE -ne 0) { throw 'NETWORKSERVICE_SCM_START_FAILED' }
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $networkOutput = Get-Content $networkResult -Raw -ErrorAction SilentlyContinue
          } while ($networkOutput -notmatch 'NETWORK_SERVICE_PROBE=PASS' -and $networkOutput -notmatch 'NETWORK_SERVICE_PROBE=FAIL' -and (Get-Date) -lt $deadline)
          if ($networkOutput -notmatch 'NETWORK_SERVICE_PROBE=PASS') { throw "DIFFERENT_WINDOWS_IDENTITY_REJECT_FAILED: $networkOutput" }
          'DIFFERENT_WINDOWS_IDENTITY_REJECT=PASS' | Add-Content "$root\result.txt"
          sc.exe stop TokenSaverPhone02NetworkProbe 2>$null | Out-Null
          sc.exe delete TokenSaverPhone02NetworkProbe | Out-Null
          $appName = 'Phone02R3AppContainerProbe'
          $cs = @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class AppContainerProbe {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct STARTUPINFO { public int cb; public string lpReserved; public string lpDesktop; public string lpTitle; public int dwX,dwY,dwXSize,dwYSize,dwXCountChars,dwYCountChars,dwFillAttribute,dwFlags; public short wShowWindow,cbReserved2; public IntPtr lpReserved2,hStdInput,hStdOutput,hStdError; }
            [StructLayout(LayoutKind.Sequential)] public struct STARTUPINFOEX { public STARTUPINFO StartupInfo; public IntPtr lpAttributeList; }
            [StructLayout(LayoutKind.Sequential)] public struct SECURITY_CAPABILITIES { public IntPtr AppContainerSid; public IntPtr Capabilities; public uint CapabilityCount; public uint Reserved; }
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_INFORMATION { public IntPtr hProcess,hThread; public uint dwProcessId,dwThreadId; }
            [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int CreateAppContainerProfile(string n,string d,string desc,IntPtr caps,uint count,out IntPtr sid);
            [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int DeriveAppContainerSidFromAppContainerName(string n,out IntPtr sid);
            [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int DeleteAppContainerProfile(string n);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool InitializeProcThreadAttributeList(IntPtr p,int count,int flags,ref IntPtr size);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool UpdateProcThreadAttribute(IntPtr p,uint flags,IntPtr attr,ref SECURITY_CAPABILITIES value,IntPtr size,IntPtr prev,IntPtr ret);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool CreateProcess(string app,StringBuilder cmd,IntPtr pa,IntPtr ta,bool inherit,uint flags,IntPtr env,string cwd,ref STARTUPINFOEX si,out PROCESS_INFORMATION pi);
            [DllImport("kernel32.dll",SetLastError=true)] public static extern uint WaitForSingleObject(IntPtr h,uint ms);
            [DllImport("kernel32.dll",SetLastError=true)] public static extern bool GetExitCodeProcess(IntPtr h,out uint code);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
            [DllImport("kernel32.dll")] public static extern IntPtr LocalFree(IntPtr h);
            [DllImport("kernel32.dll",SetLastError=true)] public static extern bool DeleteProcThreadAttributeList(IntPtr p);
            public static string SidString(IntPtr sid) { return new System.Security.Principal.SecurityIdentifier(sid).Value; }
            public static uint Run(string exe,string name) {
              IntPtr sid=IntPtr.Zero, list=IntPtr.Zero; PROCESS_INFORMATION pi=new PROCESS_INFORMATION();
              int hr=CreateAppContainerProfile(name,name,"Temporary isolated R3 test profile",IntPtr.Zero,0,out sid);
              if (hr!=0) { hr=DeriveAppContainerSidFromAppContainerName(name,out sid); if(hr!=0) throw new Exception("APPCONTAINER_PROFILE_FAILED:0x"+hr.ToString("X8")); }
              try {
                IntPtr bytes=IntPtr.Zero; InitializeProcThreadAttributeList(IntPtr.Zero,1,0,ref bytes);
                list=Marshal.AllocHGlobal(bytes); if(!InitializeProcThreadAttributeList(list,1,0,ref bytes)) throw new Exception("ATTRIBUTE_LIST_INIT_FAILED:"+Marshal.GetLastWin32Error());
                SECURITY_CAPABILITIES caps=new SECURITY_CAPABILITIES{AppContainerSid=sid,Capabilities=IntPtr.Zero,CapabilityCount=0,Reserved=0};
                if(!UpdateProcThreadAttribute(list,0,new IntPtr(0x00020009),ref caps,(IntPtr)Marshal.SizeOf(typeof(SECURITY_CAPABILITIES)),IntPtr.Zero,IntPtr.Zero)) throw new Exception("SECURITY_CAPABILITIES_FAILED:"+Marshal.GetLastWin32Error());
                STARTUPINFOEX si=new STARTUPINFOEX(); si.StartupInfo.cb=Marshal.SizeOf(typeof(STARTUPINFOEX)); si.lpAttributeList=list;
                StringBuilder cmd=new StringBuilder("\""+exe+"\" --probe-appcontainer");
                if(!CreateProcess(exe,cmd,IntPtr.Zero,IntPtr.Zero,false,0x00080000|0x08000000,IntPtr.Zero,null,ref si,out pi)) throw new Exception("APPCONTAINER_CREATEPROCESS_FAILED:"+Marshal.GetLastWin32Error());
                WaitForSingleObject(pi.hProcess,30000); uint code; if(!GetExitCodeProcess(pi.hProcess,out code)) throw new Exception("APPCONTAINER_EXITCODE_FAILED");
                CloseHandle(pi.hThread); CloseHandle(pi.hProcess); return code;
              } finally { if(list!=IntPtr.Zero){DeleteProcThreadAttributeList(list);Marshal.FreeHGlobal(list);} if(sid!=IntPtr.Zero) LocalFree(sid); }
            }
          }
          '@
          Add-Type -TypeDefinition $cs
          $sidPtr = [IntPtr]::Zero
          $hr = [AppContainerProbe]::CreateAppContainerProfile($appName,$appName,'Temporary isolated R3 test profile',[IntPtr]::Zero,0,[ref]$sidPtr)
          if ($hr -ne 0) { $hr = [AppContainerProbe]::DeriveAppContainerSidFromAppContainerName($appName,[ref]$sidPtr) }
          if ($hr -ne 0) { throw ('APPCONTAINER_PROFILE_FAILED: 0x{0:X8}' -f $hr) }
          $sidText = [AppContainerProbe]::SidString($sidPtr)
          [AppContainerProbe]::LocalFree($sidPtr)
          icacls $root /grant "*$($sidText):(RX)" | Out-Null
          icacls $probe /grant "*$($sidText):(R)" | Out-Null
          icacls $exe /grant "*$($sidText):(RX)" | Out-Null
          $exit = [AppContainerProbe]::Run($exe,$appName)
          if ($exit -ne 0) { throw "REAL_APPCONTAINER_REJECT_FAILED: $exit" }
          [AppContainerProbe]::DeleteAppContainerProfile($appName) | Out-Null
          'REAL_APPCONTAINER_REJECT=PASS' | Add-Content "$root\result.txt"
          $r = Get-Content "$root\result.txt" -Raw
          foreach ($p in @('COMMON_PROCESS_REJECT=PASS','DIFFERENT_WINDOWS_IDENTITY_REJECT=PASS','REAL_APPCONTAINER_REJECT=PASS')) {
            if (-not $r.Contains($p)) { throw "NEGATIVE_PROOF_MISSING: $p" }
          }
      - name: Cleanup and post-cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force out-r3 | Out-Null
          $root = 'C:\ProgramData\Phone02CredentialStoreR3'
          if (Test-Path "$root\result.txt") { Copy-Item "$root\result.txt" out-r3\evidence.txt }
          $evidence = if (Test-Path out-r3\evidence.txt) { Get-Content out-r3\evidence.txt -Raw } else { '' }
          $secretPattern = '(?i)(client_secret|access_token|refresh_token|password)\s*[:=]\s*\S{8,}'
          if ($evidence -match $secretPattern) { throw 'SECRET_SCAN_FAILED' }
          'SECRET_SCAN=PASS' | Add-Content out-r3\summary.txt
          $svc = Get-Service -Name 'TokenSaverPhone02Supervisor' -ErrorAction SilentlyContinue
          if ($svc) {
            if ($svc.Status -ne 'Stopped') { Stop-Service -Name 'TokenSaverPhone02Supervisor' -Force -ErrorAction SilentlyContinue }
            sc.exe delete TokenSaverPhone02Supervisor | Out-Null
          }
          $networkSvc = Get-Service -Name 'TokenSaverPhone02NetworkProbe' -ErrorAction SilentlyContinue
          if ($networkSvc) { if ($networkSvc.Status -ne 'Stopped') { Stop-Service -Name 'TokenSaverPhone02NetworkProbe' -Force -ErrorAction SilentlyContinue }; sc.exe delete TokenSaverPhone02NetworkProbe | Out-Null }
          if ('AppContainerProbe' -as [type]) { [AppContainerProbe]::DeleteAppContainerProfile('Phone02R3AppContainerProbe') | Out-Null }
          Start-Sleep -Seconds 6
          if (Get-Process -Name 'CredentialStoreR3' -ErrorAction SilentlyContinue) { throw 'PROCESS_CLEANUP_FAILED' }
          if (Test-Path $root) { takeown /F $root /R /D Y | Out-Null; icacls $root /grant 'BUILTIN\Administrators:(OI)(CI)F' /T /C | Out-Null; icacls $root /reset /T /C | Out-Null }
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path $root) { throw 'POST_CLEANUP_FAILED' }
          $artifactText = (Get-ChildItem out-r3 -File | ForEach-Object { Get-Content $_.FullName -Raw }) -join [Environment]::NewLine
          if ($artifactText -match $secretPattern) { throw 'ARTIFACT_SCAN_FAILED' }
          'ARTIFACT_SCAN=PASS' | Add-Content out-r3\summary.txt
          'CLEANUP=PASS' | Add-Content out-r3\summary.txt
          $required = @('CLEANUP=PASS','DPAPI_NG=PASS','LOCAL_SERVICE=PASS','SERVICE_SID=PASS','AUTHORIZED_ACCESS=PASS','STORE_ACL=PASS','WRITE=PASS','READ=PASS','REPLACE=PASS','REMOVE=PASS','COMMON_PROCESS_REJECT=PASS','DIFFERENT_WINDOWS_IDENTITY_REJECT=PASS','REAL_APPCONTAINER_REJECT=PASS','SECRET_SCAN=PASS','ARTIFACT_SCAN=PASS')
          $all = $true
          foreach ($p in $required) { if (-not $evidence.Contains($p) -and -not (Get-Content out-r3\summary.txt -Raw).Contains($p)) { $all=$false } }
          if (-not $all) { 'R3_VERDICT=BLOCKED' | Add-Content out-r3\summary.txt; throw 'R3_REQUIRED_MARKERS_MISSING' }
          'R3_VERDICT=PASS' | Add-Content out-r3\summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone02-credential-store-r3-sanitized
          path: out-r3/
          if-no-files-found: warn
          retention-days: 7
