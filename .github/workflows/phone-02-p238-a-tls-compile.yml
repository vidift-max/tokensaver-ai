name: Phone-02 P2.38-A Supervisor HTTPS TLS compile and policy
on:
  push:
    branches:
      - mission/phone-02-controlled-integration
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-compile-policy:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate RPC stubs, compile and run endpoint policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $x86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $x86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath).Trim()
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $sdk = Get-ChildItem (Join-Path $x86 'Windows Kits\10\bin') -Directory | Where-Object Name -Match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1
          $midl = Join-Path $sdk.FullName 'x64\midl.exe'
          Write-Host ('VISUAL_STUDIO_PATH=' + $vs)
          Write-Host ('WINDOWS_SDK_VERSION=' + $sdk.Name)
          Write-Host 'HTTP_TLS_LIBRARY=Windows inbox WinHTTP API (winhttp.dll / winhttp.lib)'
          foreach ($p in @($vcvars,$midl)) { if (-not (Test-Path $p)) { throw "Missing tool: $p" } }
          $build = Join-Path $env:RUNNER_TEMP 'p238a-build'
          New-Item -ItemType Directory -Force $build | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE 'services\phone-supervisor'
          $midlCmd = '"' + $vcvars + '" && "' + $midl + '" /nologo /env x64 /h "' + (Join-Path $build 'phone_supervisor_rpc.h') + '" /iid "' + (Join-Path $build 'phone_supervisor_rpc_i.c') + '" /out "' + $build + '" "' + (Join-Path $src 'phone_supervisor_rpc.idl') + '"'
          & cmd.exe /d /s /c $midlCmd
          if ($LASTEXITCODE -ne 0) { throw 'MIDL failed' }
          $svc = Join-Path $build 'supervisor.exe'
          $svcCmd = '"' + $vcvars + '" && cl /nologo /EHsc /W4 /std:c++20 /DUNICODE /D_UNICODE /I"' + $build + '" "' + (Join-Path $src 'phone_supervisor.cpp') + '" "' + (Join-Path $src 'RealSupervisorTeamRoomHttpsAdapter.cpp') + '" "' + (Join-Path $build 'phone_supervisor_rpc_s.c') + '" /Fe:"' + $svc + '" advapi32.lib rpcrt4.lib bcrypt.lib userenv.lib shell32.lib ole32.lib winhttp.lib'
          & cmd.exe /d /s /c $svcCmd
          if ($LASTEXITCODE -ne 0) { throw 'Supervisor/WinHTTP compile failed' }
          $cli = Join-Path $build 'client.exe'
          $cliCmd = '"' + $vcvars + '" && cl /nologo /EHsc /W4 /std:c++20 /DUNICODE /D_UNICODE /I"' + $build + '" "' + (Join-Path $src 'phone_supervisor_client.cpp') + '" "' + (Join-Path $build 'phone_supervisor_rpc_c.c') + '" /Fe:"' + $cli + '" rpcrt4.lib ole32.lib'
          & cmd.exe /d /s /c $cliCmd
          if ($LASTEXITCODE -ne 0) { throw 'RPC client compile failed' }
          $tests = Join-Path $build 'tls-policy-tests.exe'
          $testCmd = '"' + $vcvars + '" && cl /nologo /EHsc /W4 /std:c++20 /DUNICODE /D_UNICODE /I"' + $src + '" "' + (Join-Path $src 'phone_supervisor_tls_policy_tests.cpp') + '" "' + (Join-Path $src 'RealSupervisorTeamRoomHttpsAdapter.cpp') + '" /Fe:"' + $tests + '" winhttp.lib'
          & cmd.exe /d /s /c $testCmd
          if ($LASTEXITCODE -ne 0) { throw 'TLS policy tests compile failed' }
          & $tests
          if ($LASTEXITCODE -ne 0) { throw 'TLS endpoint policy tests failed' }
          Get-FileHash $svc,$cli,$tests -Algorithm SHA256 | Format-Table -AutoSize
          New-Item -ItemType Directory -Force 'p238a-evidence' | Out-Null
          Copy-Item $tests 'p238a-evidence\tls-policy-tests.exe'
          'IMPLEMENTED_POLICY_TESTS_EXECUTED_TLS_HANDSHAKE_NOT_PROVEN' | Set-Content 'p238a-evidence\classification.txt'
      - name: Upload P2.38-A compile and policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-p238a-tls-compile-policy
          path: p238a-evidence
          if-no-files-found: warn

  windows-appcontainer-supervisor-teamroom-tls:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact isolated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Execute real AppContainer to Supervisor to HTTPS tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ('P238A_COMMIT=' + $env:GITHUB_SHA)
          Write-Host ('P238A_RUN_ID=' + $env:GITHUB_RUN_ID)
          Write-Host ('P238A_JOB=windows-appcontainer-supervisor-teamroom-tls')
          & .\scripts\phone-02-p238-a-tls-e2e.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P2.38-A Windows TLS E2E script failed' }

      - name: Record numeric GitHub run and job IDs
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100"
          $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $current = $response.jobs | Where-Object { $_.name -eq $env:GITHUB_JOB } | Select-Object -First 1
          $jobId = if ($current) { [string]$current.id } else { 'UNAVAILABLE' }
          $evidence = Join-Path $env:RUNNER_TEMP 'phone02-p238a-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $metadata = Join-Path $evidence 'run-metadata.txt'
          $lines = if (Test-Path $metadata) { @(Get-Content $metadata) } else { @() }
          $lines = @($lines | Where-Object { $_ -notmatch '^job_id=' })
          $lines += "job_id=$jobId"
          Set-Content $metadata $lines -Encoding ASCII
      - name: Upload sanitized P2.38-A Windows TLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-p238a-real-https-tls-e2e
          path: ${{ runner.temp }}/phone02-p238a-evidence
          if-no-files-found: warn
