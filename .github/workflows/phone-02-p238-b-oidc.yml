name: Phone-02 P2.38-B Windows Runner Bootstrap (No OIDC)

on:
  push:
    branches:
      - mission/phone-02-p238-b-oidc
    paths:
      # Deliberately omit this workflow file: editing its trigger must not
      # bootstrap the legacy PostgreSQL/Keycloak/MSIX environment.
      - scripts/phone-02-p238-b-runner.ps1
      - scripts/phone-02-p238-a-tls-e2e.ps1
      - services/ai-team-room/**
      - services/phone-supervisor/**
      # Round 3 owns an isolated LocalService/DPAPI-NG harness. Never route
      # those changes through the legacy full-stack bootstrap.
      - '!services/phone-supervisor/credential-store-r3/**'
      # Round 4 has its own Windows AppContainer fail-closed workflow.
      - '!services/phone-supervisor/phone_supervisor.cpp'
      - '!services/phone-supervisor/phone_supervisor_client.cpp'
      - '!services/phone-supervisor/TeamRoomScenarioGateR4.h'
      - '!services/phone-supervisor/phone_supervisor_r4_tests.cpp'
      - '!scripts/phone-02-p238-a-tls-e2e.ps1'
      # Round 5 has a dedicated OIDC build and runtime workflow.
      - '!services/phone-supervisor/oidc-r5/**'
      - '!services/phone-supervisor/SupervisorCredentialStoreR5.*'
      - '!services/phone-supervisor/SupervisorCredentialProvisioningR5.*'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to execute (must match the selected ref)
        required: true
        type: choice
        options:
          - mission/phone-02-p238-b-oidc
        default: mission/phone-02-p238-b-oidc

permissions:
  contents: read
  actions: read

concurrency:
  group: phone02-p238b-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-runner-bootstrap:
    name: Windows PostgreSQL + Keycloak + Team Room + Supervisor + MSIX/AppContainer
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ephemeral Keycloak Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify branch and runner contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/mission/phone-02-p238-b-oidc') {
            throw "Refused unexpected branch: $env:GITHUB_REF"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              '${{ inputs.target_branch }}' -ne 'mission/phone-02-p238-b-oidc') {
            throw 'workflow_dispatch target_branch mismatch'
          }
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Expected windows-2025 x64 runner'
          }
          Write-Host "RUNNER_LABEL=windows-2025"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "GITHUB_REF=$env:GITHUB_REF"
          Write-Host "GITHUB_SHA=$env:GITHUB_SHA"
          java -version
          cargo --version

      - name: Provision ephemeral PostgreSQL, Keycloak and full Team Room; run approved Windows MSIX/TLS harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\phone-02-p238-b-runner.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "P2.38-B runner bootstrap script failed with exit code $LASTEXITCODE"
          }

      - name: Capture numeric GitHub run and job provenance
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'phone02-p238b-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100"
          $provenanceFile = Join-Path $evidence 'github-provenance.txt'
          $jobId = 'NOT_FOUND'
          $provenanceStatus = 'FAIL'
          $provenanceFailure = 'job_not_identified'
          try {
            $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
            $expectedBranch = 'mission/phone-02-p238-b-oidc'
            $expectedDisplayName = 'Windows PostgreSQL + Keycloak + Team Room + Supervisor + MSIX/AppContainer'
            $matchingJobs = @($response.jobs | Where-Object {
              $_.run_id -eq [long]$env:GITHUB_RUN_ID -and
              $_.head_sha -eq $env:GITHUB_SHA -and
              $_.head_branch -eq $expectedBranch -and
              $_.name -eq $expectedDisplayName -and
              $_.runner_name -eq $env:RUNNER_NAME
            })
            if ($matchingJobs.Count -ne 1) {
              throw "Expected exactly one matching job; found $($matchingJobs.Count)"
            }
            $numericJobId = 0L
            if (-not [long]::TryParse([string]$matchingJobs[0].id, [ref]$numericJobId) -or $numericJobId -le 0) {
              throw 'GitHub returned a non-numeric or invalid job ID'
            }
            $jobId = [string]$numericJobId
            $provenanceStatus = 'PASS'
            $provenanceFailure = 'none'
          } catch {
            $provenanceFailure = 'type=' + $_.Exception.GetType().FullName
          }
          @(
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "job_id=$jobId"
            "job_name=$env:GITHUB_JOB"
            "branch=$env:GITHUB_REF"
            "sha=$env:GITHUB_SHA"
            "event=$env:GITHUB_EVENT_NAME"
            "runner=$env:RUNNER_NAME"
            "GITHUB_JOB_PROVENANCE=$provenanceStatus"
            "GITHUB_JOB_PROVENANCE_DIAGNOSTIC=$provenanceFailure"
          ) | Set-Content $provenanceFile -Encoding utf8
          $hashLines = Get-ChildItem $evidence -File | Where-Object Name -ne 'SHA256SUMS' | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          }
          $hashLines | Set-Content (Join-Path $evidence 'SHA256SUMS') -Encoding ascii
          Write-Host "GITHUB_JOB_PROVENANCE=$provenanceStatus"
          if ($provenanceStatus -ne 'PASS') {
            throw "GITHUB_JOB_PROVENANCE=FAIL ($provenanceFailure)"
          }

      - name: Upload sanitized Windows runner evidence, including FAIL logs
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-p238b-windows-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phone02-p238b-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Record artifact locator and digest
        if: always()
        shell: pwsh
        run: |
          "P238B_ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "P238B_ARTIFACT_URL=${{ steps.upload.outputs.artifact-url }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "P238B_ARTIFACT_SHA256=${{ steps.upload.outputs.artifact-digest }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "OIDC_FLOW=NOT_EXECUTED" | Add-Content $env:GITHUB_STEP_SUMMARY
