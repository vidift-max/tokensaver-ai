name: Phone-02 P2.36 Supervisor Windows Service
on:
  push:
    branches:
      - mission/phone-02-controlled-integration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone02-p236-supervisor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supervisor-windows-service:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout isolated P2.36 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute P2.36 Windows Service and AppContainer regression
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\phone-02-p236-supervisor.ps1'
          if (-not (Test-Path $script)) { throw 'P2.36 test script missing' }
          & $script
      - name: Upload P2.36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-p236-supervisor-evidence
          path: ${{ runner.temp }}/phone02-p236-evidence
          if-no-files-found: warn
