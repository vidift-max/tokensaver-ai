name: Phone-02 P2.34 RPC Identity PoA
on:
  push:
    branches:
      - security/phone-02-windows-identity-poa
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone02-msix-package-poa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  msix-package-poa:
    name: Windows MSIX package and activation PoA
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Execute fifty-round consolidated RPC identity PoA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\experimental\phone02-msix-rpc-poa.ps1'
          if (-not (Test-Path $script)) { throw 'MSIX PoA script missing' }
          & $script
      - name: Upload MSIX PoA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-p234-rpc-evidence
          path: ${{ runner.temp }}/phone02-p234-rpc-evidence
          if-no-files-found: warn
      - name: Remove temporary evidence workspace
        if: always()
        shell: pwsh
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP 'phone02-p234-rpc-evidence'
          if (Test-Path $evidencePath) { Remove-Item -LiteralPath $evidencePath -Recurse -Force -ErrorAction Stop }
          if (Test-Path $evidencePath) { throw 'Temporary evidence workspace remains after artifact upload' }
          Write-Host 'RUNNER_TEMP_EVIDENCE_REMAINS=False'
