name: Phone-02 Windows Identity PoA

on:
  push:
    branches:
      - security/phone-02-windows-identity-poa

permissions:
  contents: read

jobs:
  windows-identity-poa:
    name: Windows identity PoA — inventory
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Real Windows and toolchain inventory
        id: inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'phone02-poa-inventory'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'

          $makeappx = @()
          $signtool = @()
          if (Test-Path $sdkRoot) {
            $makeappx = @(Get-ChildItem $sdkRoot -Filter MakeAppx.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
            $signtool = @(Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }

          $cl = @()
          if (Test-Path $env:ProgramFiles) {
            $cl = @(Get-ChildItem (Join-Path $env:ProgramFiles 'Microsoft Visual Studio') -Filter cl.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          $msbuild = @()
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -property installationPath
            if ($vs) {
              $candidate = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
              if (Test-Path $candidate) { $msbuild += $candidate }
            }
          }

          $inventory = [ordered]@{
            captured_utc = (Get-Date).ToUniversalTime().ToString('o')
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            computer_name = $env:COMPUTERNAME
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            os_architecture = $os.OSArchitecture
            processor_architecture = $cpu.Architecture
            powershell = $PSVersionTable.PSVersion.ToString()
            node = (& node --version 2>&1 | Out-String).Trim()
            windows_sdk_bin_root = $sdkRoot
            makeappx_paths = $makeappx
            signtool_paths = $signtool
            cl_paths = $cl
            msbuild_paths = $msbuild
            vswhere_path = $vswhere
          }
          $inventory | ConvertTo-Json -Depth 8 | Tee-Object -FilePath (Join-Path $out 'inventory.json')

          $missing = @()
          if ($env:RUNNER_OS -ne 'Windows') { $missing += 'RUNNER_OS is not Windows' }
          if (-not $makeappx.Count) { $missing += 'MakeAppx.exe missing' }
          if (-not $signtool.Count) { $missing += 'SignTool.exe missing' }
          if (-not $cl.Count) { $missing += 'cl.exe missing' }
          if (-not $inventory.node.StartsWith('v22.')) { $missing += 'Node.js 22 not found' }
          if ($missing.Count) {
            $missing | Set-Content (Join-Path $out 'missing-requirements.txt')
            Write-Error ('Essential Windows tooling missing: ' + ($missing -join '; '))
            exit 1
          }

          "INVENTORY_JSON=$out\inventory.json" >> $env:GITHUB_OUTPUT

      - name: Upload Windows inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-windows-poa-inventory
          path: ${{ runner.temp }}/phone02-poa-inventory
          if-no-files-found: warn
