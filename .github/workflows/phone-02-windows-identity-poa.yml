name: Phone-02 Windows Identity PoA
on:
  push:
    branches:
      - security/phone-02-windows-identity-poa
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone02-msix-package-poa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  msix-package-poa:
    name: Windows MSIX package and activation PoA
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Execute ten-round isolated MSIX construction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\experimental\phone02-msix-package-poa.ps1'
          if (-not (Test-Path $script)) { throw 'MSIX PoA script missing' }
          & $script
      - name: Upload MSIX PoA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone02-msix-package-poa-evidence
          path: ${{ runner.temp }}/phone02-msix-poa
          if-no-files-found: warn
